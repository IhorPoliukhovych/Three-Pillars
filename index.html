<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Three Pillars of Society: an entertainment pilot project that places 300+ jobs from the military, state and commerce on one status ladder. Compare up to three people.">
<meta property="og:title" content="Three Pillars of Society">
<meta property="og:description" content="Where do you stand on the social ladder? Military, state and commerce on one scale.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Three Pillars of Society</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: sticky header with tabs → three person cards → tab body (map+ladder | ranking | career sim | about) */
:root{
  --bg:#f3f4fa; --surface:#ffffff; --sunk:#f0f2f8; --ink:#11142a; --muted:#5b6280; --faint:#9aa0b8; --line:#e1e4ef;
  --army:#4f7d1f; --state:#2557c7; --biz:#c26a12; --ext:#8b5cd6; --star:#d4a106;
  --pa:#ec2f5b; --pb:#0aa2c8; --pc:#12a36b;
  --k0:#7c8399; --k1:#2f9e8f; --k2:#3478d6; --k3:#6c4fd6; --k4:#c2389b; --k5:#e0662a; --k6:#c99a06;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(17,20,42,.05),0 8px 24px rgba(17,20,42,.06);
  --glow:radial-gradient(900px 300px at 10% -10%,rgba(236,47,91,.10),transparent 60%),radial-gradient(800px 300px at 60% -20%,rgba(10,162,200,.10),transparent 60%),radial-gradient(700px 300px at 100% 0%,rgba(18,163,107,.10),transparent 60%);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d18; --surface:#141729; --sunk:#0f1222; --ink:#eceefb; --muted:#9ba1c0; --faint:#5d6383; --line:#242842;
  --army:#97c55a; --state:#6d9bff; --biz:#f39a3d; --ext:#b494ff; --star:#ffd23f;
  --pa:#ff5c80; --pb:#33cdf0; --pc:#3fe0a0;
  --k0:#9aa1b8; --k1:#4fd1bf; --k2:#69a5ff; --k3:#9f87ff; --k4:#f06bc8; --k5:#ff8f57; --k6:#ffd23f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --glow:radial-gradient(900px 300px at 10% -10%,rgba(255,92,128,.16),transparent 60%),radial-gradient(800px 300px at 60% -20%,rgba(51,205,240,.13),transparent 60%),radial-gradient(700px 300px at 100% 0%,rgba(63,224,160,.12),transparent 60%);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0d18; --surface:#141729; --sunk:#0f1222; --ink:#eceefb; --muted:#9ba1c0; --faint:#5d6383; --line:#242842;
  --army:#97c55a; --state:#6d9bff; --biz:#f39a3d; --ext:#b494ff; --star:#ffd23f;
  --pa:#ff5c80; --pb:#33cdf0; --pc:#3fe0a0;
  --k0:#9aa1b8; --k1:#4fd1bf; --k2:#69a5ff; --k3:#9f87ff; --k4:#f06bc8; --k5:#ff8f57; --k6:#ffd23f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --glow:radial-gradient(900px 300px at 10% -10%,rgba(255,92,128,.16),transparent 60%),radial-gradient(800px 300px at 60% -20%,rgba(51,205,240,.13),transparent 60%),radial-gradient(700px 300px at 100% 0%,rgba(63,224,160,.12),transparent 60%);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);background-image:var(--glow);background-repeat:no-repeat;color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1480px;margin:0 auto}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr .inner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo svg{flex:none}
.logo b{font:800 15px var(--f-display);letter-spacing:-.01em;white-space:nowrap}
nav.tabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--muted);white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.right{display:flex;gap:8px;flex-wrap:wrap}

main{display:flex;flex-direction:column;gap:16px;padding-block:18px 48px}
.intro{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 24px}
h1{font:800 clamp(22px,3.2vw,36px)/1.1 var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--army),var(--state),var(--biz),var(--ext));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro p{margin:4px 0 0;color:var(--muted);max-width:72ch}

/* person cards */
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.people{grid-template-columns:1fr}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);position:relative;min-width:0}
.pcard:focus-within{z-index:5}
.pcard::before{content:"";position:absolute;inset:0 0 auto 0;height:70px;border-radius:18px 18px 0 0;background:linear-gradient(135deg,color-mix(in srgb,var(--pcol) 22%,transparent),transparent 70%);pointer-events:none}
.phead{display:flex;align-items:center;gap:10px;position:relative}
.badge{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font:800 14px var(--f-display);color:#fff;background:var(--pcol);box-shadow:0 4px 12px color-mix(in srgb,var(--pcol) 40%,transparent)}
.pname{flex:1;min-width:0;border:1px solid transparent;background:transparent;font:800 17px var(--f-body);color:var(--ink);padding:3px 6px;border-radius:8px}
.pname:hover,.pname:focus{border-color:var(--line);background:var(--surface);outline:none}
.pscore{text-align:right;line-height:1}
.pscore b{font:800 30px var(--f-display);color:var(--pcol)}
.pscore small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.08em}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
.fields .full{grid-column:1/-1}
.flabel{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;margin-bottom:3px;display:flex;justify-content:space-between;gap:6px}
.flabel button{border:0;background:none;color:var(--pcol);font-size:10px;font-weight:800;cursor:pointer;padding:0;letter-spacing:.06em;text-transform:uppercase}
.combo{position:relative}
.inp,.combo input{width:100%;font:inherit;font-weight:600;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink);min-width:0}
.inp:focus,.combo input:focus{border-color:var(--pcol);outline:none;background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--pcol) 18%,transparent)}
.inp.over{border-color:var(--pcol);background:color-mix(in srgb,var(--pcol) 8%,var(--surface))}
.combo ul{position:absolute;z-index:50;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:min(320px,50vh);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.combo li{padding:7px 9px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px}
.combo li span{min-width:0}
.combo li small{color:var(--muted);font-size:11px;white-space:nowrap;font-family:var(--f-mono)}
.combo li.act{background:var(--sunk)}
.combo li.empty{color:var(--muted);cursor:default}
.combo li i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px}
.pfoot{display:flex;flex-direction:column;gap:6px}
.pctbar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.pctbar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--pcol) 35%,transparent),var(--pcol));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.pmeta b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.chip i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* panels */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
@media (max-width:1180px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-width:0}
.ptool{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 18px;padding:12px 16px;border-bottom:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px}
.ctrls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600}
.ctrls input[type=range]{width:120px;accent-color:var(--ink);vertical-align:middle}
.tgl{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.tgl input{accent-color:var(--star);width:16px;height:16px}
.chart{position:relative;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.mapv{display:flex;flex-direction:column;gap:16px}
.below{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media (max-width:1100px){.below{grid-template-columns:1fr}}
.below .panel{padding:16px;display:flex;flex-direction:column;gap:12px}
.cln{font-family:var(--f-body);font-weight:800;letter-spacing:.02em}
.clr{font-family:var(--f-mono);font-weight:500;font-size:10.5px;fill:var(--muted)}
.focus{display:flex;gap:6px;overflow-x:auto;width:100%;scrollbar-width:none}
.focus button{flex:none;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.focus button i{width:9px;height:9px;border-radius:3px}
.focus button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.clchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--kc);background:color-mix(in srgb,var(--kc) 13%,transparent);padding:2px 9px;border-radius:999px}
.cscroll{overflow-x:auto}
.ctab{min-width:560px;font-size:13px}
.ctab th[scope=row]{position:static;text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:700;color:var(--muted);width:24%;background:transparent}
.ctab thead th{font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:800}
.ctab thead th .dotb{display:inline-grid;vertical-align:middle;margin-right:4px}
.ctab td{vertical-align:top;line-height:1.35}
.cmut{color:var(--muted);font-size:12px}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk);min-width:120px}
.split span{display:block;height:100%}
.gl{stroke:var(--line)}
.gt{fill:var(--faint);font:10.5px var(--f-mono)}
.ptitle{font:800 13px var(--f-display);letter-spacing:.06em}
.psub{fill:var(--muted);font:10.5px var(--f-mono)}
.lbl{fill:var(--muted);font:500 11px var(--f-body);cursor:pointer}
.lbl:hover{fill:var(--ink)}
.lbl.hl{font-weight:800}
.lbl.fam{fill:var(--ink);font-weight:800}
.hit{fill:transparent;cursor:pointer}
.pm{transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.pm text{font:800 11px var(--f-display);fill:#fff}
.tip{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;min-width:220px;max-width:280px;pointer-events:none;font-size:13px}
.tip.pin{pointer-events:auto}
.tip h4{margin:0 0 2px;font-size:14.5px;line-height:1.3}
.tip .sub{color:var(--muted);font-size:12px}
.tip .row{display:flex;gap:14px;margin-top:8px;font-family:var(--f-mono);font-size:12px}
.tip .cmprow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:4px 0;font-size:12.5px}
.tip .cmprow .nm{min-width:0;font-weight:700}
.tip .cmprow .nm small{display:block;font-weight:500;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip .assign{display:flex;gap:6px;margin-top:8px}
.tip .assign button{flex:1;border:0;border-radius:8px;padding:6px;color:#fff;font-weight:800;cursor:pointer}

/* ladder */
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;margin:0}
.pchips{display:flex;gap:6px}
.pchips button{flex:1;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:6px 8px;cursor:pointer;font-weight:800;display:flex;align-items:center;gap:6px;min-width:0}
.pchips button span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchips button[aria-pressed="true"]{background:var(--surface);border-color:var(--pcol);box-shadow:0 0 0 3px color-mix(in srgb,var(--pcol) 18%,transparent)}
.dotb{width:18px;height:18px;border-radius:6px;flex:none;display:grid;place-items:center;color:#fff;font:800 10px var(--f-display);background:var(--pcol)}
.ladder{display:flex;flex-direction:column;gap:3px}
.rung{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 8px;border-radius:10px;font-size:13px}
.rung:hover{background:var(--sunk)}
.rung>i{align-self:stretch;border-radius:2px}
.rung span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rung span small{color:var(--muted);font-size:11.5px}
.rung em{font-style:normal;font-family:var(--f-mono);font-size:11.5px;padding:2px 7px;border-radius:99px;background:var(--sunk);white-space:nowrap}
.rung.me{background:color-mix(in srgb,var(--pcol) 14%,var(--surface));font-weight:800;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pcol) 45%,transparent)}
.rung.me em{background:var(--pcol);color:#fff}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.shelf div{border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.shelf b{font-size:12.5px;line-height:1.3}
.shelf small{color:var(--muted);font-size:11px;font-family:var(--f-mono)}
.shelf .pt{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}

/* ranking */
.rk{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px}
.rk .bar1{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rk input[type=search]{flex:1;min-width:200px;max-width:380px}
.fchip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.fchip[aria-pressed="false"]{opacity:.45}
.tscroll{overflow:auto;max-height:calc(100vh - 220px)}
table{width:100%;border-collapse:collapse;min-width:760px;font-size:13px}
th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);z-index:1}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hitrow td{background:color-mix(in srgb,var(--pcol) 10%,var(--surface))}
.bar{height:7px;border-radius:99px;background:var(--sunk);position:relative;min-width:90px}
.bar span{position:absolute;inset:0 auto 0 0;border-radius:99px}
.ptag{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:6px;color:#fff;font:800 10px var(--f-display);margin-right:4px;vertical-align:middle}

/* career */
.sim{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.sim{grid-template-columns:1fr}}
.sim .panel{padding:16px;display:flex;flex-direction:column;gap:14px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;text-align:left}
.quick button:hover{border-color:var(--pcol)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;background:var(--sunk)}
.kpi b{font:800 22px var(--f-display);line-height:1.15}
.kpi small{color:var(--muted);font-size:12px}
.path{display:flex;flex-direction:column;gap:0;position:relative}
.step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;position:relative}
.step::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:2px;background:var(--line)}
.step:first-child::before{top:50%}.step:last-child::before{bottom:50%}
.step .nd{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:800 11px var(--f-mono);color:#fff;position:relative;z-index:1}
.step b{font-size:14px}
.step small{color:var(--muted);font-size:12px;display:block}
.step em{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.note{color:var(--muted);font-size:13px;margin:0}

/* about */
.disc{grid-column:1/-1;border:1px solid color-mix(in srgb,var(--k6) 50%,var(--line));background:color-mix(in srgb,var(--k6) 8%,var(--surface));border-radius:14px;padding:16px 18px}
.disc p{color:var(--ink)!important}
.sitefoot{padding-block:0 32px}
.sitefoot p{margin:0;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px}
.wctl{flex-basis:100%;display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px dashed var(--line)}
.wrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.wpre{display:flex;flex-wrap:wrap;gap:6px}
.wpre button{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted)}
.wpre button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wslide{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;color:var(--muted);max-width:520px}
.wslide input{flex:1;accent-color:var(--ink)}
.wf{display:flex;flex-direction:column;gap:3px;font-size:13px}
.wex{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.wex .dotb{display:inline-grid}
.about{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.about section{display:flex;flex-direction:column;gap:6px}
.about h3{margin:0;font:700 15px var(--f-display)}
.about p{margin:0;color:var(--muted);max-width:68ch}

function combo(root,{opts,label,pick,ph}){
  const inp=root.querySelector("input"),ul=root.querySelector("ul");let list=[],act=0;
  inp.placeholder=ph;inp.value=label();
  const draw=()=>{ul.innerHTML=list.length?list.map((o,i)=>`<li role="option" data-i="${i}" class="${i===act?"act":""}"><span>${o.dot?`<i style="background:${o.dot}"></i>`:""}${esc(o.label)}</span>${o.sub?`<small>${esc(o.sub)}</small>`:""}</li>`).join(""):`<li class="empty">${t("noMatch")}</li>`;ul.querySelector(".act")?.scrollIntoView({block:"nearest"})};
  const show=q=>{list=opts(q.trim().toLowerCase());act=0;ul.hidden=false;draw()};
  const done=i=>{const o=list[i];if(!o)return;ul.hidden=true;pick(o.v);inp.blur()};
  inp.addEventListener("focus",()=>{inp.select();show("")});
  inp.addEventListener("input",()=>show(inp.value));
  inp.addEventListener("keydown",e=>{if(ul.hidden)return;
    if(e.key==="ArrowDown"){act=Math.min(act+1,list.length-1);draw();e.preventDefault()}
    else if(e.key==="ArrowUp"){act=Math.max(act-1,0);draw();e.preventDefault()}
    else if(e.key==="Enter"){done(act);e.preventDefault()}
    else if(e.key==="Escape"){ul.hidden=true;inp.blur()}});
  ul.addEventListener("mousedown",e=>{const li=e.target.closest("li[data-i]");if(li){e.preventDefault();done(+li.dataset.i)}});
  inp.addEventListener("blur",()=>setTimeout(()=>{ul.hidden=true;inp.value=label()},150));
  return ()=>{if(document.activeElement!==inp)inp.value=label()};
}
const posOpts=(q,ind)=>{
  const own=ITEMS.filter(x=>(!ind||x.ind===ind)&&(!q||x.name.toLowerCase().includes(q))).map(x=>({v:x.id,label:x.name,sub:money(x.inc,true),dot:pc(x.p)}));
  if(!ind||q.length<2)return own.slice(0,ind?100:60);
  return own.concat(ITEMS.filter(x=>x.ind!==ind&&(x.name.toLowerCase().includes(q)||x.indName.toLowerCase().includes(q))).slice(0,25).map(x=>({v:x.id,label:x.name,sub:x.indName,dot:pc(x.p)})));
};

/* ===== CLUSTERS ===== */
const CLP=[0,.20,.50,.80,.95,.99,.999,1];
const CLR=["0–20%","20–50%","50–80%","80–95%","95–99%","99–99.9%","0.1%"];
let CL=[];
function buildClusters(){
  const arr=ITEMS.filter(x=>x.w>0).sort((a,b)=>a.s-b.s);let cum=0,k=1;const th=[0];
  for(const x of arr){cum+=x.w;while(k<CLP.length-1&&cum/TOTAL>=CLP[k]){th.push(x.s);k++}}
  while(th.length<CLP.length-1)th.push(100);
  th.push(100);
  CL=CLP.slice(0,-1).map((_,i)=>({i,lo:th[i],hi:Math.max(th[i],th[i+1])}));
}
const clusterOf=s=>{let c=CL[0];for(const b of CL)if(s>=b.lo&&b.hi>b.lo)c=b;return c};
const clName=i=>t("cl")[i];
const wsum=f=>ITEMS.filter(f).reduce((a,x)=>a+x.w,0);
function needIncome(target,pw){ // base units: US $/yr, UA ₴/mo; null if impossible
  if(S.W<.01)return null;
  const need=(target-(1-S.W)*pw)/S.W;if(need>100)return null;
  const [a,b]=RANGE[S.country];let v=Math.pow(10,a+Math.max(0,need)/100*(b-a));return US()?v:v/12;
}

const starPts=(cx,cy,r)=>{let p=[];for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?r*.45:r;p.push((cx+rr*Math.cos(a)).toFixed(1)+","+(cy+rr*Math.sin(a)).toFixed(1))}return p.join(" ")};
function wrap(s,n){const w=s.split(" "),out=[];let cur="";for(const x of w){if(cur&&(cur+" "+x).length>n){out.push(cur);cur=x}else cur=cur?cur+" "+x:x}if(cur)out.push(cur);return out}
let YF=s=>0;
function renderMap(){
  const box=document.getElementById("chartBox"),mob=box.clientWidth>0&&box.clientWidth<760;
  if(mob!==MOB){MOB=mob;document.getElementById("lp").innerHTML=""}
  const Lc=LAY(),Y=s=>Lc.TOP+(100-s)*Lc.K,VH=Lc.TOP+100*Lc.K+28;YF=Y;
  const svg=document.getElementById("chart");
  svg.setAttribute("viewBox",`0 0 ${Lc.VW} ${VH}`);svg.style.minWidth=MOB?"0":"1180px";
  svg.setAttribute("aria-label",t("h1").replace(/<[^>]+>/g,""));
  document.getElementById("focus").hidden=!MOB;
  document.getElementById("focus").innerHTML=ORDER.map(p=>`<button data-p="${p}" aria-pressed="${focusP()===p}"><i style="background:${pc(p)}"></i>${PILLARS[p].n[L()]}</button>`).join("");
  document.getElementById("defs").innerHTML=ORDER.map(p=>`<linearGradient id="g-${p}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${pc(p)}"/><stop offset="1" style="stop-color:${pc(p)};stop-opacity:.25"/></linearGradient>`).join("");
  let g="";
  // social clusters as full-width bands
  CL.forEach(b=>{if(b.hi<=b.lo)return;const y1=Y(b.hi),y2=Y(b.lo),h=y2-y1,c=`var(--k${b.i})`;
    g+=`<rect x="0" y="${y1}" width="${Lc.VW}" height="${h}" style="fill:${c}" opacity="${b.i%2?.11:.06}"/>`;
    g+=`<line x1="0" x2="${Lc.VW}" y1="${y1}" y2="${y1}" style="stroke:${c}" stroke-opacity=".55" stroke-dasharray="4 4"/>`;
    g+=`<rect x="${Lc.clX-4}" y="${y1+2}" width="4" height="${Math.max(0,h-4)}" rx="2" style="fill:${c}"/>`;
    if(h>=(MOB?30:26)){const lines=wrap(clName(b.i),Lc.clWrap);const fs=MOB?12:12.5;
      g+=`<text class="cln" x="${Lc.clX+4}" y="${y1+fs+4}" style="font-size:${fs}px;fill:${c}">${lines.map((l,k)=>`<tspan x="${Lc.clX+4}" dy="${k?fs+1:0}">${esc(l)}</tspan>`).join("")}<tspan class="clr" x="${Lc.clX+4}" dy="${fs+2}">${CLR[b.i]}</tspan></text>`}
  });
  if(!MOB)for(let s=0;s<=100;s+=10)g+=`<text class="gt" x="4" y="${Y(s)+4}">${s}</text>`;
  const near=x=>R.findIndex(r=>Math.abs(r.s-x.s)<=2.2);
  const shown=MOB?[focusP()]:ORDER;
  for(const p of shown){
    const it=ITEMS.filter(x=>x.p===p),fm=S.fam?FAM.filter(x=>x.p===p):[];
    if(!it.length)continue;
    const all=it.concat(fm).sort((a,b)=>b.s-a.s),cx=Lc.cx[p];
    const top=Y(all[0].s)-16,bot=Y(all[all.length-1].s)+16;
    const mx=Math.max(...it.map(x=>x.s)),mn=Math.min(...it.map(x=>x.s));
    g+=`<rect x="${cx-8}" y="${top}" width="16" height="${bot-top}" rx="8" fill="url(#g-${p})"/>`;
    g+=`<text class="ptitle" x="${cx}" y="${Math.max(18,top-26)}" text-anchor="${MOB?"start":"middle"}" fill="${pc(p)}" style="font-size:${MOB?15:13}px">${PILLARS[p].n[L()].toUpperCase()}</text>`;
    g+=`<text class="psub" x="${cx}" y="${Math.max(32,top-10)}" text-anchor="${MOB?"start":"middle"}">${mn.toFixed(0)} → ${mx.toFixed(0)}</text>`;
    for(const x of it){const y=Y(x.s);g+=`<line x1="${cx-14}" x2="${cx+14}" y1="${y}" y2="${y}" stroke="${pc(p)}" stroke-width="1.8" opacity=".75"/>`}
    const prio=all.map(x=>({x,pr:near(x)>=0?0:x.fam?1:2,w:x.w})).sort((a,b)=>a.pr-b.pr||b.w-a.w);
    const used={L:[],R:[]},fits=(side,y)=>!used[side].some(v=>Math.abs(v-y)<Lc.gap)&&y>top-4;
    for(const {x} of prio){
      const y=Y(x.s);let side=null,ly=y;
      outer:for(const d of [0,-3,3,-6,6])for(const sd of Lc.sides)if(fits(sd,y+d)){side=sd;ly=y+d;break outer}
      if(!side)continue;used[side].push(ly);
      const r=side==="R",x0=r?cx+16:cx-16,x1=r?cx+22:cx-22,ni=near(x);
      const st=`font-size:${Lc.font}px;${ni>=0?`fill:var(${PCOL[ni]})`:""}`;
      g+=`<path d="M${x0} ${y} L${x1} ${ly}" stroke="${pc(p)}" stroke-opacity=".5" fill="none"/>`;
      g+=`<text class="lbl${ni>=0?" hl":""}${x.fam?" fam":""}" style="${st}" x="${r?x1+3:x1-3}" y="${ly+Lc.font*.34}" text-anchor="${r?"start":"end"}" data-id="${x.id}">${esc(trunc(x.fam?"★ "+x.name:short(x.name),Lc.trunc))}</text>`;
    }
    for(const x of fm)g+=`<polygon points="${starPts(cx,Y(x.s),8)}" stroke="var(--surface)" stroke-width="1.5" data-id="${x.id}" style="fill:var(--star);cursor:pointer"/>`;
    for(const x of it)g+=`<rect class="hit" x="${cx-16}" y="${Y(x.s)-3}" width="32" height="6" data-id="${x.id}"/>`;
  }
  document.getElementById("lb").innerHTML=g;
  renderPersons(Lc,Y);
}
function renderPersons(Lc,Y){
  const lp=document.getElementById("lp");
  if(!lp.children.length){
    const x0=MOB?0:Lc.tagX+Lc.tagW;
    lp.innerHTML=PL.map((l,pi)=>`<g class="pm" id="band${pi}"><rect x="${x0}" y="${-Lc.K*1.4}" width="${Lc.bandR-x0}" height="${Lc.K*2.8}" style="fill:var(${PCOL[pi]})" opacity=".13"/><line x1="${x0}" x2="${Lc.bandR}" y1="0" y2="0" style="stroke:var(${PCOL[pi]})" stroke-width="1.8" stroke-dasharray="7 5"/><g id="tagw${pi}" data-person="${pi}" style="cursor:pointer"><rect x="${Lc.tagX}" y="-11" width="${Lc.tagW}" height="22" rx="7" style="fill:var(${PCOL[pi]})"/><text id="tagt${pi}" x="${Lc.tagX+Lc.tagW/2}" y="4" text-anchor="middle"></text></g></g>`).join("")+
      PL.map((l,pi)=>`<g class="pm" id="mk${pi}" data-person="${pi}" style="cursor:pointer"><circle r="18" style="fill:var(${PCOL[pi]})" opacity=".22"/><circle r="12" style="fill:var(${PCOL[pi]});stroke:var(--surface)" stroke-width="3"/><text y="4" text-anchor="middle">${l}</text></g>`).join("");
  }
  const ys=R.map((r,pi)=>({pi,y:Y(r.s)})).sort((a,b)=>a.y-b.y);let last=-1e9;
  ys.forEach(o=>{o.ty=Math.max(o.y,last+24);last=o.ty});
  ys.forEach(o=>{const r=R[o.pi];
    document.getElementById("band"+o.pi).style.transform=`translate(0px,${o.y}px)`;
    document.getElementById("tagw"+o.pi).setAttribute("transform",`translate(0,${o.ty-o.y})`);
    document.getElementById("tagt"+o.pi).textContent=MOB?PL[o.pi]:PL[o.pi]+" "+r.s.toFixed(0);
    const same=R.filter((q,j)=>j<o.pi&&q.p===r.p&&Math.abs(q.s-r.s)<2.5).length;
    const mk=document.getElementById("mk"+o.pi);
    mk.style.transform=`translate(${Lc.cx[r.p]+same*26}px,${o.y}px)`;
    mk.style.opacity=MOB&&r.p!==focusP()?0:1;
  });
}
document.getElementById("focus").addEventListener("click",e=>{const b=e.target.closest("button");if(b){S.focus=b.dataset.p;refresh()}});
if(window.ResizeObserver)new ResizeObserver(()=>{const w=document.getElementById("chartBox").clientWidth;if(w&&(w<760)!==MOB&&S.tab==="map")renderMap()}).observe(document.getElementById("chartBox"));
// tooltip
const tip=document.getElementById("tip"),box=document.getElementById("chartBox");let pinned=false;
const find=id=>ITEMS.find(i=>i.id===id)||FAM.find(i=>i.id===id);
function showTip(el,pin){
  const x=find(el.dataset.id);if(!x)return;const cl=clusterOf(x.s);
  tip.innerHTML=`<h4>${x.fam?"★ ":""}${esc(x.name)}</h4><div class="sub">${esc(x.indName)} · ${PILLARS[x.p].n[L()]}</div>
   <div class="row"><span>${esc(money(x.inc))}</span><span>${t("pw")} ${x.pw}</span><span>${t("level")} ${x.s.toFixed(0)}</span></div>
   <div class="row" style="color:var(--muted)">${t("incPts")} ${incIdx(ann(x.inc)).toFixed(0)} · ${t("pwPts")} ${x.pw}</div>
   <div class="row" style="color:var(--muted)"><span style="color:var(--k${cl.i});font-weight:700">${clName(cl.i)}</span>${!x.fam?`<span>${t("cols")[6]}: ${ppl(x.w)}</span>`:""}</div>
   ${pin&&!x.fam?`<div class="sub" style="margin-top:10px">${t("assign")}</div><div class="assign">${PL.map((l,pi)=>`<button data-pi="${pi}" style="background:var(${PCOL[pi]})">${l}</button>`).join("")}</div>`:""}`;
  tip.hidden=false;tip.classList.toggle("pin",pin);tip.dataset.id=x.id;
  const b=box.getBoundingClientRect(),e=el.getBoundingClientRect(),tw=Math.min(280,b.width-8);
  let left=e.right-b.left+box.scrollLeft+10,top=e.top-b.top+box.scrollTop-12;
  if(left+tw>box.scrollLeft+b.width)left=e.left-b.left+box.scrollLeft-tw-10;
  if(left<box.scrollLeft+4)left=box.scrollLeft+4,top=e.bottom-b.top+box.scrollTop+8;
  tip.style.left=left+"px";tip.style.top=Math.max(4,top)+"px";
}
const svgEl=document.getElementById("chart");
svgEl.addEventListener("mouseover",e=>{if(pinned)return;const pp=e.target.closest("[data-person]");if(pp){showPTip(pp,false);return}const d=e.target.closest("[data-id]");if(d)showTip(d,false)});
svgEl.addEventListener("mouseout",e=>{if(!pinned&&e.target.closest("[data-id],[data-person]"))tip.hidden=true});
svgEl.addEventListener("click",e=>{const pp=e.target.closest("[data-person]");if(pp){pinned=true;showPTip(pp,true);e.stopPropagation();return}const d=e.target.closest("[data-id]");if(d){pinned=true;showTip(d,true);e.stopPropagation()}});
function placeTip(el){
  const b=box.getBoundingClientRect(),e=el.getBoundingClientRect(),tw=Math.min(300,b.width-8);
  let left=e.right-b.left+box.scrollLeft+10,top=e.top-b.top+box.scrollTop-12;
  if(left+tw>box.scrollLeft+b.width)left=e.left-b.left+box.scrollLeft-tw-10;
  if(left<box.scrollLeft+4)left=box.scrollLeft+4,top=e.bottom-b.top+box.scrollTop+8;
  tip.style.left=left+"px";tip.style.top=Math.max(4,top)+"px";
}
function showPTip(el,pin){
  const pi=+el.dataset.person,r=R[pi],cl=clusterOf(r.s),ann0=ann(r.inc);
  const others=R.map((q,j)=>({q,j})).filter(o=>o.j!==pi).map(({q,j})=>{
    const d=r.s-q.s,ratio=ann0/ann(q.inc);
    return `<div class="cmprow"><span class="dotb" style="--pcol:var(${PCOL[j]})">${PL[j]}</span><span class="nm">${esc(pname(j))}<small>${esc(q.base.name)} · ${q.s.toFixed(0)}</small></span><span class="mono" style="color:${Math.abs(d)<1?"var(--muted)":d>0?"var(--pc)":"var(--pa)"};font-weight:800">${Math.abs(d)<1?"=":(d>0?"+":"")+d.toFixed(1)}</span><span class="mono cmut">${t("incX")} ×${+ratio.toFixed(2)}</span></div>`}).join("");
  tip.innerHTML=`<div style="display:flex;align-items:center;gap:8px;--pcol:var(${PCOL[pi]})"><span class="dotb">${PL[pi]}</span><h4>${esc(pname(pi))}</h4></div>
   <div class="sub">${esc(r.base.name)} · ${esc(r.base.indName)}</div>
   <div class="row"><span>${esc(money(r.inc))}</span><span>${t("pw")} ${r.pw}</span><span>${t("level")} ${r.s.toFixed(1)}</span></div>
   <div class="row"><span class="clchip" style="--kc:var(--k${cl.i})">${clName(cl.i)}</span><span style="color:var(--muted)">${t("pctPeople").replace("{p}",pctOf(r.s))}</span></div>
   <p class="eyebrow" style="margin:10px 0 4px">${t("vsOthers")}</p>${others}`;
  tip.hidden=false;tip.classList.toggle("pin",pin);delete tip.dataset.id;placeTip(el);
}
tip.addEventListener("click",e=>{const b=e.target.closest("button[data-pi]");if(!b)return;const x=find(tip.dataset.id);const P=S.persons[+b.dataset.pi];
  P.ind=x.ind;P.i=x.i;clearOv(P);S.sel=+b.dataset.pi;pinned=false;tip.hidden=true;refresh()});
document.addEventListener("click",e=>{if(pinned&&!tip.contains(e.target)){pinned=false;tip.hidden=true}});

/* ===== LADDER ===== */
function chips(cur,key){return `<div class="pchips" data-key="${key}">${PL.map((l,pi)=>`<button style="--pcol:var(${PCOL[pi]})" aria-pressed="${cur===pi}" data-pi="${pi}"><span class="dotb">${l}</span><span>${esc(pname(pi))}</span></button>`).join("")}</div>`}
const rung=(x,d)=>`<div class="rung" title="${esc(x.name)}"><i style="background:${pc(x.p)}"></i><span>${x.fam?"★ ":""}${esc(x.name)} <small>· ${esc(x.indName)}</small></span><em>${d>0?"+":""}${d.toFixed(1)}</em></div>`;
function renderLadder(){
  const pi=S.sel,r=R[pi],pool=ITEMS.concat(S.fam?FAM:[]).filter(x=>x.id!==r.base.id);
  const up=pool.filter(x=>x.s>r.s).sort((a,b)=>a.s-b.s).slice(0,6).reverse();
  const dn=pool.filter(x=>x.s<=r.s).sort((a,b)=>b.s-a.s).slice(0,6);
  const shelf=ORDER.filter(p=>p!==r.p).map(p=>ITEMS.filter(x=>x.p===p).sort((a,b)=>Math.abs(a.s-r.s)-Math.abs(b.s-r.s))[0]).filter(Boolean);
  document.getElementById("ladder").innerHTML=`<p class="eyebrow">${t("ladderT")}</p>${chips(pi,"sel")}
   <div class="ladder" style="--pcol:var(${PCOL[pi]})"><p class="eyebrow" style="margin:2px 0">${t("above")}</p>${up.map(x=>rung(x,x.s-r.s)).join("")}
     <div class="rung me"><i style="background:var(--pcol)"></i><span>${esc(pname(pi))} <small>· ${esc(r.base.name)}</small></span><em>${r.s.toFixed(1)}</em></div>
     <p class="eyebrow" style="margin:6px 0 2px">${t("below")}</p>${dn.map(x=>rung(x,x.s-r.s)).join("")}</div>
   <p class="eyebrow">${t("shelf")}</p>
   <div class="shelf">${shelf.map(x=>`<div style="border-color:color-mix(in srgb,${pc(x.p)} 40%,var(--line))"><span class="pt" style="color:${pc(x.p)}">${PILLARS[x.p].n[L()]}</span><b>${esc(x.name)}</b><small>${esc(money(x.inc))} · ${x.s.toFixed(0)}</small></div>`).join("")}</div>`;
}
document.addEventListener("click",e=>{const b=e.target.closest(".pchips button");if(!b)return;const key=b.parentElement.dataset.key;S[key]=+b.dataset.pi;if(key==="sel")S.focus=null;refresh()});

/* ===== COMPARISON ===== */
function renderCompare(){
  const N=ITEMS.length,cols=R.map((r,pi)=>{
    const below=wsum(x=>x.s<r.s-1),above=wsum(x=>x.s>r.s+1),same=Math.max(0,TOTAL-below-above);
    const cl=clusterOf(r.s),nx=CL.slice(cl.i+1).find(b=>b.hi>b.lo);
    const annual=US()?r.inc:r.inc*12,monthly=US()?r.inc/12:r.inc;
    let next=`<span class="cmut">${t("cmpTop")}</span>`;
    if(nx){const ni=needIncome(nx.lo+.1,r.pw);next=`<b style="color:var(--k${nx.i})">${clName(nx.i)}</b><br><span class="cmut">+${(nx.lo-r.s).toFixed(1)} · ${ni==null?t("cmpPw"):"≈ "+money(ni)}</span>`}
    return {r,pi,below,above,same,cl,annual,monthly,next,rank:ITEMS.filter(x=>x.s>r.s).length+1};
  });
  const pct=v=>Math.round(100*v/TOTAL)+"%";
  const rowsDef=[
    ["position",c=>`<b>${esc(c.r.base.name)}</b><br><span class="cmut">${esc(c.r.base.indName)}</span>`],
    ["pillar",c=>`<span class="chip"><i style="background:${pc(c.r.p)}"></i>${PILLARS[c.r.p].n[L()]}</span>`],
    ["incM",c=>`<span class="mono">${money(c.monthly,true)}</span>${c.r.over?` <span class="cmut">(${t("own")})</span>`:""}`],
    ["incY",c=>`<span class="mono">${money(c.annual,true)}</span>`],
    ["power",c=>`<span class="mono">${c.r.pw}</span>`],
    ["points",c=>`<span class="mono">${incIdx(ann(c.r.inc)).toFixed(0)} · ${c.r.pw}</span>`],
    ["level",c=>`<div style="display:flex;align-items:center;gap:8px"><b class="mono" style="color:var(${PCOL[c.pi]})">${c.r.s.toFixed(1)}</b><div class="bar" style="flex:1;min-width:60px"><span style="width:${c.r.s}%;background:var(${PCOL[c.pi]})"></span></div></div>`],
    ["cluster",c=>`<span class="clchip" style="--kc:var(--k${c.cl.i})">${clName(c.cl.i)}</span>`],
    ["split",c=>`<div class="split"><span style="width:${100*c.below/TOTAL}%;background:var(${PCOL[c.pi]})"></span><span style="width:${100*c.same/TOTAL}%;background:color-mix(in srgb,var(${PCOL[c.pi]}) 40%,transparent)"></span><span style="width:${100*c.above/TOTAL}%;background:var(--line)"></span></div>`],
    ["cooler",c=>`<b class="mono" style="font-size:16px">${pct(c.below)}</b> <span class="cmut">· ${ppl(c.below)}</span>`],
    ["sameLvl",c=>`<span class="mono">${pct(c.same)}</span> <span class="cmut">· ${ppl(c.same)}</span>`],
    ["simpler",c=>`<span class="mono">${pct(c.above)}</span> <span class="cmut">· ${ppl(c.above)}</span>`],
    ["holders",c=>`<span class="mono">${ppl(c.r.base.w)}</span>`],
    ["rank",c=>`<span class="mono">#${c.rank}</span> <span class="cmut">${t("of")} ${N}</span>`],
    ["next",c=>c.next],
    ["vsA",c=>c.pi===0?`<span class="cmut">—</span>`:(()=>{const d=c.r.s-cols[0].r.s,ri=c.annual/cols[0].annual;return `<b class="mono" style="color:${d>=0?"var(--pc)":"var(--pa)"}">${d>=0?"+":""}${d.toFixed(1)}</b> <span class="cmut">· ${t("incX")} ×${(+ri.toFixed(2))}</span>`})()]
  ];
  const lab=t("cmpRows");
  document.getElementById("cmp").innerHTML=`<p class="eyebrow">${t("cmpT")}</p><div class="cscroll"><table class="ctab"><thead><tr><th></th>${cols.map(c=>`<th style="--pcol:var(${PCOL[c.pi]})"><span class="dotb">${PL[c.pi]}</span> ${esc(pname(c.pi))}</th>`).join("")}</tr></thead>
   <tbody>${rowsDef.map(([k,f])=>`<tr><th scope="row">${lab[k].replace("{a}",esc(pname(0)))}</th>${cols.map(c=>`<td>${f(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
   <p class="note">${t("cmpNote")}</p>`;
}

/* ===== RANKING ===== */
function renderRank(){
  document.getElementById("q").placeholder=t("search");
  document.getElementById("pf").innerHTML=ORDER.map(p=>`<button class="fchip" data-p="${p}" aria-pressed="${!!S.pf[p]}"><i style="width:9px;height:9px;border-radius:3px;background:${pc(p)}"></i>${PILLARS[p].n[L()]}</button>`).join("");
  document.getElementById("thead").innerHTML="<tr>"+t("cols").map(c=>`<th>${c}</th>`).join("")+"</tr>";
  const q=document.getElementById("q").value.trim().toLowerCase();
  const rows=ITEMS.concat(S.fam?FAM:[]).map(x=>({...x,tags:R.map((r,pi)=>r.base.id===x.id&&!r.over&&!r.pwOver?pi:-1).filter(v=>v>=0)}));
  R.forEach((r,pi)=>{if(r.over||r.pwOver)rows.push({...r,name:pname(pi)+" · "+r.base.name,tags:[pi],w:0,me:true})});
  rows.sort((a,b)=>b.s-a.s);
  document.getElementById("tbody").innerHTML=rows.map((x,k)=>({x,k})).filter(({x})=>S.pf[x.p]&&(!q||x.tags.length||x.name.toLowerCase().includes(q)||x.indName.toLowerCase().includes(q))).map(({x,k})=>{
    const tg=x.tags[0];
    return `<tr class="${x.tags.length?"hitrow":""}" ${x.tags.length?`style="--pcol:var(${PCOL[tg]})"`:""}><td class="num">${k+1}</td><td>${x.tags.map(pi=>`<span class="ptag" style="background:var(${PCOL[pi]})">${PL[pi]}</span>`).join("")}${x.fam?"★ ":""}<b style="font-weight:${x.tags.length||x.fam?800:500}">${esc(x.name)}</b></td><td style="color:var(--muted)">${esc(x.indName)}</td>
     <td><span class="chip"><i style="background:${pc(x.p)}"></i>${PILLARS[x.p].n[L()]}</span></td><td class="num">${esc(money(x.inc))}</td><td class="num">${x.pw}</td><td class="num">${x.fam||x.me?"—":ppl(x.w)}</td>
     <td><div style="display:flex;align-items:center;gap:8px"><span class="num" style="width:24px">${x.s.toFixed(0)}</span><div class="bar" style="flex:1"><span style="width:${x.s}%;background:${pc(x.p)}"></span></div></div></td></tr>`}).join("");
}
document.getElementById("pf").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.pf[b.dataset.p]=S.pf[b.dataset.p]?0:1;refresh()});
document.getElementById("q").addEventListener("input",()=>renderRank());

/* ===== CAREER ===== */
let simRef=null;
function buildSim(){
  document.getElementById("simCtl").innerHTML=`<div><p class="eyebrow" style="margin-bottom:6px">${t("simWho")}</p><div id="simChips"></div></div>
   <div style="--pcol:var(--ink)"><label class="flabel" for="simIn">${t("simTo")}</label><div class="combo" id="simCombo"><input id="simIn" autocomplete="off" role="combobox"><ul role="listbox" hidden></ul></div></div>
   <div><p class="eyebrow" style="margin-bottom:6px">${t("simQuick")}</p><div class="quick" id="simQuick"></div></div>`;
  simRef=combo(document.getElementById("simCombo"),{ph:t("simPick"),label:()=>(ITEMS.find(x=>x.id===S.simT)||{}).name||"",opts:q=>posOpts(q,null),pick:v=>{S.simT=v;refresh()}});
  document.getElementById("simQuick").addEventListener("click",e=>{const b=e.target.closest("button[data-id]");if(b){S.simT=b.dataset.id;refresh()}});
}
function renderSim(){
  if(!ITEMS.find(x=>x.id===S.simT))S.simT=ITEMS.slice().sort((a,b)=>b.s-a.s)[20].id;
  simRef&&simRef();
  const pi=S.simP,r=R[pi],tg=ITEMS.find(x=>x.id===S.simT);
  document.getElementById("simChips").innerHTML=chips(pi,"simP");
  const same=ITEMS.filter(x=>x.ind===r.base.ind&&x.s>r.s+1).sort((a,b)=>a.s-b.s).slice(0,3);
  const other=ORDER.filter(p=>p!==r.p&&p!=="ext").map(p=>ITEMS.filter(x=>x.p===p&&x.s>r.s+3).sort((a,b)=>a.s-b.s)[0]).filter(Boolean);
  document.getElementById("simQuick").innerHTML=same.concat(other).map(x=>`<button data-id="${x.id}" style="--pcol:${pc(x.p)}"><span class="chip"><i style="background:${pc(x.p)}"></i>${esc(x.name)}</span></button>`).join("");
  const d=tg.s-r.s,c=`var(${PCOL[pi]})`;
  let out=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="badge" style="--pcol:${c}">${PL[pi]}</span><b style="font-size:16px">${esc(r.base.name)}</b><span style="color:var(--muted)">→</span><span class="chip" style="font-size:16px"><i style="background:${pc(tg.p)}"></i>${esc(tg.name)}</span></div>`;
  if(Math.abs(d)<1){out+=`<p class="note">${t("simSame")}</p>`}
  else if(d<0){out+=`<p class="note">${t("simDown")}</p>`}
  else{
    const lo=r.s,hi=tg.s,between=ITEMS.filter(x=>x.s>lo&&x.s<hi).reduce((a,x)=>a+x.w,0);
    const ratio=tg.inc/r.inc;
    const need=(hi-(1-S.W)*r.pw)/S.W;let needTxt;
    if(need>100)needTxt=t("simNeedNo");else{const [a,b]=RANGE[S.country];let v=Math.pow(10,a+Math.max(0,need)/100*(b-a));if(!US())v/=12;needTxt=t("simNeedOk").replace("{v}","<b>"+money(v)+"</b>")}
    out+=`<div class="kpis">
      <div class="kpi"><small>${t("simGap")}</small><b style="color:${c}">+${d.toFixed(1)}</b><small>${r.s.toFixed(0)} → ${hi.toFixed(0)}</small></div>
      <div class="kpi"><small>${t("simInc")}</small><b>${money(tg.inc,true)}</b><small>${ratio>=1?"×"+(+ratio.toFixed(1))+" "+t("simX"):""}</small></div>
      <div class="kpi"><small>${t("pw")}</small><b>${r.pw} → ${tg.pw}</b><small>${PILLARS[tg.p].n[L()]}</small></div>
      <div class="kpi"><small>${t("simPpl")}</small><b>${ppl(between)}</b><small>${Math.round(100*between/TOTAL)}%</small></div></div>
     <div><p class="eyebrow">${t("simNeed")}</p><p class="note" style="margin-top:4px">${needTxt}</p></div>`;
    let steps=ITEMS.filter(x=>x.ind===tg.ind&&x.s>lo+.5&&x.s<hi-.5);
    if(steps.length<2)steps=steps.concat(ITEMS.filter(x=>x.p===tg.p&&x.ind!==tg.ind&&x.s>lo+.5&&x.s<hi-.5).sort((a,b)=>b.w-a.w).slice(0,4));
    steps.sort((a,b)=>a.s-b.s);
    if(steps.length>6){const k=steps.length/5;steps=[0,1,2,3,4].map(i=>steps[Math.floor(i*k)])}
    const seq=[{x:r.base,me:true,s:r.s}].concat(steps.map(x=>({x,s:x.s}))).concat([{x:tg,s:tg.s,goal:true}]);
    out+=`<div><p class="eyebrow" style="margin-bottom:6px">${t("simPath")}</p><div class="path">${seq.map((o,k)=>`<div class="step"><span class="nd" style="background:${o.me?c:pc(o.x.p)}">${o.me?PL[pi]:o.s.toFixed(0)}</span><div><b>${esc(o.me?pname(pi):o.x.name)}</b><small>${esc(o.me?r.base.name:o.x.indName)}</small></div><em>${esc(money(o.me?r.inc:o.x.inc))}</em></div>`).join("")}</div></div>`;
  }
  document.getElementById("simOut").innerHTML=out;
}

/* ===== ABOUT ===== */
function renderAbout(){document.getElementById("v-about").innerHTML=`<section class="disc"><h3>${t("discT")}</h3>${t("disc").map(p=>`<p>${p}</p>`).join("")}</section>`+t("about").map(([h,p])=>`<section><h3>${h}</h3><p>${p}</p></section>`).join("")}

/* ===== WIRING ===== */
function staticText(){
  document.documentElement.lang=S.lang==="uk"?"uk":"en";
  document.title=t("logo");
  document.getElementById("t-logo").textContent=t("logo");
  document.getElementById("t-h1").innerHTML=t("h1");
  document.getElementById("t-lede").textContent=t("lede");
  document.getElementById("t-money").textContent=t("money");
  document.getElementById("t-wq").textContent=t("wq");
  document.getElementById("wpre").innerHTML=t("wPre").map(([v,l])=>`<button data-v="${v}">${l}</button>`).join("");
  document.getElementById("fdisc").textContent=t("fdisc");
  document.getElementById("t-power").textContent=t("power");
  document.getElementById("t-fam").textContent=t("fam");
  document.getElementById("famT").checked=S.fam;
  document.querySelectorAll("#tabs button").forEach((b,i)=>{b.textContent=t("tabs")[i];b.setAttribute("aria-selected",b.dataset.tab===S.tab)});
  const sc=document.querySelectorAll("#segCountry button");sc[0].textContent=t("us");sc[1].textContent=t("ua");
  sc.forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S.country));
  document.querySelectorAll("#segLang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S.lang));
  document.getElementById("legend").innerHTML=ORDER.map(p=>`<span class="chip"><i style="background:${pc(p)}"></i>${PILLARS[p].n[L()]}</span>`).join("")+`<span class="chip"><i style="background:var(--star);border-radius:50%"></i>${t("fam")}</span>`;
  ["map","rank","career","about"].forEach(v=>document.getElementById("v-"+v).hidden=S.tab!==v);
  document.getElementById("people").hidden=S.tab!=="map";
  document.getElementById("w").value=Math.round(S.W*100);
}
function refresh(){
  build();
  R=S.persons.map((_,pi)=>resolve(pi));
  updatePeople();
  if(S.tab==="map"){renderW();renderMap();renderLadder();renderCompare()}
  else if(S.tab==="rank")renderRank();
  else if(S.tab==="career")renderSim();
  else renderAbout();
  save();
}
function full(){build();staticText();buildPeople();buildSim();refresh()}
document.getElementById("segCountry").addEventListener("click",e=>{const b=e.target.closest("button");if(b){S.country=b.dataset.v;full()}});
document.getElementById("segLang").addEventListener("click",e=>{const b=e.target.closest("button");if(b){S.lang=b.dataset.v;full()}});
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b){S.tab=b.dataset.tab;staticText();refresh()}});
document.getElementById("famT").addEventListener("change",e=>{S.fam=e.target.checked;refresh()});
document.getElementById("w").addEventListener("input",e=>{S.W=e.target.value/100;refresh()});
document.getElementById("wpre").addEventListener("click",e=>{const b=e.target.closest("button");if(b){S.W=+b.dataset.v/100;document.getElementById("w").value=b.dataset.v;refresh()}});
function renderW(){
  const m=Math.round(S.W*100),pw=100-m,pi=S.sel,r=R[pi],ii=incIdx(ann(r.inc));
  document.querySelectorAll("#wpre button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.v===m));
  const [a,b]=RANGE[S.country],lo=Math.pow(10,a),hi=Math.pow(10,b),per=100/(b-a);
  const loS=US()?money(lo):money(lo/12),hiS=US()?money(hi):money(hi/12);
  document.getElementById("wf").innerHTML=`<div>${t("wFormula").replace("{m}",m).replace("{p}",pw)}</div>
   <div class="cmut">${t("wScale").replace("{lo}",loS).replace("{hi}",hiS).replace("{per}",per.toFixed(0))}</div>
   <div class="wex" style="--pcol:var(${PCOL[pi]})"><span class="dotb">${PL[pi]}</span> ${esc(pname(pi))}: <span class="mono">${(m/100).toFixed(2)} × ${ii.toFixed(0)}</span> <span class="cmut">(${t("incPts")}, ${esc(money(r.inc))})</span> <span class="mono">+ ${(pw/100).toFixed(2)} × ${r.pw}</span> <span class="cmut">(${t("pwPts")})</span> <span class="mono">= <b style="color:var(--pcol)">${(S.W*ii+(1-S.W)*r.pw).toFixed(1)}</b></span>${r.base.apex&&r.s>S.W*ii+(1-S.W)*r.pw+.05?` <span class="cmut">→ <b class="mono">${r.s.toFixed(1)}</b> (${t("apexNote")})</span>`:""}</div>`;
}
full();
</script>

</body>
